<div class="modal fade" id="editModalVehicle" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Editar Vehículo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="alertaed" class="alert d-none" role="alert"></div>
      <div class="modal-body">
        <form id="editFormVehicle">
          <input type="hidden" name="id" id="editVehicleId">
          <div class="mb-3">
            <label for="editMarca" class="form-label">Marca</label>
            <input type="text" class="form-control" id="editMarca" name="editMarca">
          </div>
          <div class="mb-3">
            <label for="editModelo" class="form-label">Modelo</label>
            <input type="text" class="form-control" id="editModelo" name="editModelo">
          </div>
          <div class="mb-3">
            <label for="editMatricula" class="form-label">Matrícula</label>
            <input type="text" class="form-control" id="editMatricula" name="editMatricula" pattern="[A-Z]{3}-[0-9]{3}" required>
          </div>
          <div class="mb-3">
            <label for="editTipo" class="form-label">Tipo de vehiculo</label>
            <select id="editTipo" name="editTipo" class="form-select">
              <option value="Vehiculo Ligero">Vehículo Ligero</option>
              <option value="Furgoneta">Furgoneta</option>
              <option value="Vehiculo de Transporte Pesado">Vehículo de Transporte Pesado</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editEstado" class="form-label">Estado</label>
            <select id="editEstado" name="editEstado" class="form-select">
              <option value="Premium">Premium</option>
              <option value="Confiable">Confiable</option>
              <option value="Aceptable">Aceptable</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editDisponibilidad" class="form-label">Disponibilidad</label>
            <select id="editDisponibilidad" name="editDisponibilidad" class="form-select">
              <option value="Disponible">Disponible</option>
              <option value="No disponible">No disponible</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editCombustible" class="form-label">Tipo de combustible</label>
            <select id="editCombustible" name="editCombustible" class="form-select" required>
              <option value="Electrico">Electrico</option>
              <option value="extra">Extra</option>
              <option value="super">Super</option>
              <option value="diesel">Diesel</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editTransmision" class="form-label">Tipo de transmisión</label>
            <select id="editTransmision" name="editTransmision" class="form-select" required>
              <option value="automatico">Automático</option>
              <option value="manual">Manual</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editTarifa" class="form-label">Tarifa</label>
            <input type="number" class="form-control" id="editTarifa" name="editTarifa" min="10" step="1" required>
          </div>
          <div class="mb-3">
            <label for="editCilindraje" class="form-label">Cilindraje</label>
            <select id="editCilindraje" name="editCilindraje" class="form-select" required>
              <option value="1000 cc">1.0 Litro (1000 cc)</option>
              <option value="2000 cc">2.0 Litros (2000 cc)</option>
              <option value="3000 cc">3.0 Litros (3000 cc)</option>
              <option value="4000 cc">4.0 Litros (4000 cc)</option>
          </select>
          </div>
          <div class="mb-3">
            <label for="editDescripcion" class="form-label">Descripción del Vehículo</label>
            <textarea class="form-control" id="editDescripcion" name="editDescripcion" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Aceptar Cambios</button>
        </form>
      </div>
    </div>
  </div>
</div>

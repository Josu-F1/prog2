<!-- Modal para Editar Usuario -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="editModalLabel">Editar Usuario</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div id="alertaE" class="alert alert-danger d-none alerta-lateral" role="alert"></div>
          <div class="modal-body">
              <form id="editForm">
                  <input type="hidden" name="id" id="editUserId">

                  <!-- Nombre field -->
                  <div class="mb-3">
                      <label for="editNombre" class="form-label">Nombre</label>
                      <input type="text" class="form-control" id="editNombre" name="nombre" required>
                  </div>

                  <!-- Tipo de Usuario field -->
                  <div class="mb-3">
                      <label for="editTipoUsuario" class="form-label">Tipo de Usuario</label>
                      <select class="form-control" id="editTipoUsuario" name="tipo_usuario" required>
                          <option value="administrador">Administrador</option>
                          <option value="empleado">Empleado</option>
                          <option value="cliente">Cliente</option>
                      </select>
                  </div>

                  <!-- Contraseña field -->
                  <div class="mb-3">
                      <label for="password" class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="password" name="password" minlength="6">
                  </div>

                  <!-- Confirmar Contraseña field -->
                  <div class="mb-3">
                      <label for="passwordC" class="form-label">Confirmar Contraseña</label>
                      <input type="password" class="form-control" id="passwordC" name="passwordC" minlength="6">
                  </div>

                  <button type="submit" class="btn btn-primary">Aceptar Cambios</button>
              </form>
          </div>
      </div>
  </div>
</div>

<div class="modal fade" id="editFechaF" tabindex="-1" aria-labelledby="addRentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 shadow-sm">
        <div class="modal-header border-0">
          <h5 class="modal-title fs-5 text-dark" id="addRentModalLabel">
            <i class="bi bi-calendar-event"></i> Editar Alquiler
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formFechaF">
            <!-- Fecha y Hora Inicio -->
            <div class="mb-4">
              <label for="fecha_inicio" class="form-label fs-6 text-muted">Fecha y Hora Inicio</label>
              <input type="text" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
            </div>
            
            <!-- Fecha Fin -->
            <div class="mb-4">
              <label for="fecha_fin" class="form-label fs-6 text-muted">Fecha Fin</label>
              <input type="text" class="form-control" id="fecha_fin" name="fecha_fin" required>
            </div>
  
            <!-- Hidden Input para Alquiler ID -->
            <input type="hidden" id="editRentID" name="editRentID">
  
            <!-- Botón de envío -->
            <button type="submit" id="fecha" class="btn btn-primary w-100">Editar Fecha Fin</button>
          </form>
        </div>
      </div>
    </div>
  </div>

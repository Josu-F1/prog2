<!-- Modal -->
<div class="modal fade" id="devolucionModal" tabindex="-1" aria-labelledby="devolucionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content rounded-3 shadow-sm">
      <form id="formDevolucion">
        <div class="modal-header border-0">
          <h5 class="modal-title fs-5 text-dark" id="devolucionModalLabel">
            <i class="bi bi-arrow-repeat"></i> Registrar Devolución
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- ID del Alquiler -->
          <div class="mb-4">
            <label for="alquilerId" class="form-label fs-6 text-muted">ID del Alquiler</label>
            <input type="number" class="form-control" id="alquilerId" name="alquilerId" required>
          </div>

          <!-- Fecha de Inicio -->
          <div class="mb-4">
            <label for="fecha_inicio" class="form-label fs-6 text-muted">Fecha de Inicio</label>
            <input type="text" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
          </div>

          <!-- Fecha de Devolución -->
          <div class="mb-4">
            <label for="fechaDevolucion" class="form-label fs-6 text-muted">Fecha de Devolución</label>
            <input type="text" class="form-control" id="fechaDevolucion" name="fechaDevolucion" required>
          </div>

          <!-- Estado del Vehículo -->
          <div class="mb-4">
            <label for="estadoVehiculo" class="form-label fs-6 text-muted">Estado del Vehículo</label>
            <select class="form-select" id="estadoVehiculo" name="estadoVehiculo">
              <option value="Excelente">Excelente</option>
              <option value="Bueno">Bueno</option>
              <option value="Regular">Regular</option>
              <option value="Malo">Malo</option>
            </select>
          </div>

          <!-- Limpieza -->
          <div class="mb-4">
            <label for="limpieza" class="form-label fs-6 text-muted">Estado de Limpieza</label>
            <select class="form-select" id="limpieza" name="limpieza">
              <option value="Limpio">Limpio</option>
              <option value="Sucia">Sucia</option>
            </select>
          </div>

          <!-- Nivel de Combustible -->
          <div class="mb-4">
            <label for="nivelCombustible" class="form-label fs-6 text-muted">Nivel de Combustible</label>
            <select class="form-select" id="nivelCombustible" name="nivelCombustible">
              <option value="Lleno">Lleno</option>
              <option value="3/4">3/4</option>
              <option value="1/2">1/2</option>
              <option value="1/4">1/4</option>
              <option value="Vacío">Vacío</option>
            </select>
          </div>

          <!-- Costo por Limpieza -->
          <div class="mb-4">
            <label for="costoLimpieza" class="form-label fs-6 text-muted">Costo por Limpieza</label>
            <select class="form-select" id="costoLimpieza" name="costoLimpieza">
              <option value="0.00">Sin costo</option>
              <option value="5.00">$5.00</option>
              <option value="10.00">$10.00</option>
              <option value="15.00">$15.00</option>
              <option value="20.00">$20.00</option>
              <option value="25.00">$25.00</option>
              <option value="30.00">$30.00</option>
            </select>
          </div>

          <!-- Costo por Daños Leves -->
          <div class="mb-4">
            <label for="costoDanosLeves" class="form-label fs-6 text-muted">Costo por Daños Leves</label>
            <select class="form-select" id="costoDanosLeves" name="costoDanosLeves">
              <option value="0.00">Sin costo</option>
              <option value="50.00">$50.00</option>
              <option value="100.00">$100.00</option>
              <option value="150.00">$150.00</option>
              <option value="200.00">$200.00</option>
              <option value="250.00">$250.00</option>
            </select>
          </div>

          <!-- Costo por Daños Graves -->
          <div class="mb-4">
            <label for="costoDanosGraves" class="form-label fs-6 text-muted">Costo por Daños Graves</label>
            <select class="form-select" id="costoDanosGraves" name="costoDanosGraves">
              <option value="0.00">Sin costo</option>
              <option value="200.00">$200.00</option>
              <option value="400.00">$400.00</option>
              <option value="600.00">$600.00</option>
              <option value="800.00">$800.00</option>
              <option value="1000.00">$1000.00</option>
            </select>
          </div>

          <!-- Costo por Falta de Combustible -->
          <div class="mb-4">
            <label for="costoCombustible" class="form-label fs-6 text-muted">Costo por Falta de Combustible</label>
            <select class="form-select" id="costoCombustible" name="costoCombustible">
              <option value="0.00">Sin costo</option>
              <option value="5.00">$12.00</option>
              <option value="10.00">$24.00</option>
              <option value="20.00">$36.00</option>
              <option value="30.00">$48.00</option>
              <option value="60.00">$60.00</option>
              <option value="90.00">$72.00</option>
              <option value="100.00">$95.00</option>
            </select>
          </div>

          <!-- Observaciones -->
          <div class="mb-4">
            <label for="observaciones" class="form-label fs-6 text-muted">Observaciones</label>
            <textarea class="form-control" id="observaciones" name="observaciones" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
